<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пельместье</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            color: #fff;
            /* Используем системные шрифты с засечками для солидности */
            font-family: 'Georgia', 'Times New Roman', serif; 
            overflow: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Градиент создаст глубину и уют */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.8)), 
                        url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .content {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem); /* Размер подстроится под экран */
            font-weight: 300;
            letter-spacing: 0.15em; /* Широкий интервал для "величественности" */
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        p {
            font-size: 1rem;
            letter-spacing: 0.4em;
            color: #d4af37; /* Матовое золото */
            margin-top: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="content">
        <h1>ПЕЛЬМЕСТЬЕ</h1>
        <p>скоро открытие</p>
    </div>
</body>
</html>
