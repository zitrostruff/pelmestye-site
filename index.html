<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пельместье</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Цвет фона на случай, если картинка долго грузится */
            background-color: #1a1a1a; 
            color: #fff;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Мы делаем градиент почти прозрачным, только чтобы чуть подчеркнуть буквы */
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)), 
                        url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .content {
            text-align: center;
            padding: 20px;
            background: transparent; /* Убеждаемся, что фона у блока с текстом нет */
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            margin: 0;
            text-transform: uppercase;
            /* Глубокая мягкая тень делает буквы читаемыми на любом фоне */
            text-shadow: 2px 4px 15px rgba(0,0,0,0.8);
        }

        p {
            font-size: 1.1rem;
            letter-spacing: 0.5em;
            color: #d4af37;
            margin-top: 20px;
            text-transform: uppercase;
            /* Тень для подзаголовка */
            text-shadow: 1px 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="content">
        <h1>ПЕЛЬМЕСТЬЕ</h1>
        <p>скоро открытие</p>
    </div>
</body>
</html>
