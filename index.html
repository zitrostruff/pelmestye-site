<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пельместье</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Фон – теперь только картинка, без чёрной подложки */
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            color: #fff;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .content {
            text-align: center;
            padding: 20px;
            background: transparent;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.8);
        }

        p {
            font-size: 1.1rem;
            letter-spacing: 0.5em;
            color: #d4af37;
            margin-top: 20px;
            text-transform: uppercase;
            text-shadow: 1px 2px 8px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>ПЕЛЬМЕСТЬЕ</h1>
        <p>скоро открытие</p>
    </div>
</body>
</html>
